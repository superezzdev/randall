<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Randall — Free Random Video Chat with Strangers</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    </noscript>

    <!-- Primary SEO -->
    <meta name="description" content="Randall is a free random video chat app and Omegle alternative. Meet strangers, talk to new people instantly with no accounts and no history.">
    <meta name="keywords" content="randall, randall app, video chat, random video chat, meet strangers, omegle alternative, anonymous chat, talk to strangers, free random chat">
    <meta name="author" content="Randall">
    <meta name="theme-color" content="#f0f2f5">
    <link rel="canonical" href="https://randall.superezz.dev/">

    <!-- Open Graph (Facebook, WhatsApp, Discord, iMessage) -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://randall.superezz.dev/">
    <meta property="og:title" content="Randall — Free Random Video Chat & Meet Strangers">
    <meta property="og:description" content="One click. A real person. No accounts, no history. Join Randall for the best free random video chat with strangers.">
    <meta property="og:image" content="https://randall.superezz.dev/randalllogo.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:site_name" content="Randall">

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Randall — Meet Strangers Instantly">
    <meta name="twitter:description" content="Free random video chat. No accounts. No history. Just real conversations on Randall.">
    <meta name="twitter:image" content="https://randall.superezz.dev/randalllogo.png">

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Randall",
      "url": "https://randall.superezz.dev/",
      "description": "Randall is a free random video chat alternative to Omegle. Meet strangers and talk to new people instantly.",
      "applicationCategory": "SocialNetworkingApplication",
      "genre": "Video Chat",
      "browserRequirements": "Requires a modern web browser with WebRTC support",
      "operatingSystem": "All"
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [{
        "@type": "Question",
        "name": "Is Randall free to use?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Yes, Randall is completely free to use. There are no hidden fees or premium accounts."
        }
      }, {
        "@type": "Question",
        "name": "Do I need an account to use Randall?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "No, you do not need an account. You can start chatting instantly with one click."
        }
      }, {
        "@type": "Question",
        "name": "Is my video chat recorded?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "No, we do not record or store your video or text chats. Your conversations are entirely peer-to-peer and private."
        }
      }, {
        "@type": "Question",
        "name": "Is Randall safe?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "We prioritize safety by allowing you to instantly skip or report users who violate our community guidelines. However, you should always be cautious and never share personal information with strangers."
        }
      }]
    }
    </script>

    <!-- Mobile / PWA -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="randall">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  </head>

    <div id="root"></div>

</html>
